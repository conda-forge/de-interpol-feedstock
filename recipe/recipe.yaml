schema_version: 1

context:
  name: de-interpol
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/de-interpol-${{ version }}.tar.gz
  sha256: 0fcaa606fe37ffe9f48b79515312c50e8fe8aebe69076d83c3cd17b6158e1871

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - poetry
  run:
    - python >=${{ python_min }}
    - python-dateutil
    - urllib3 >=1.25.3

tests:
  - python:
      imports:
        - deutschland.interpol
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: "Interpol: Interpol Red Notices API"
  license: Apache-2.0
  license_file:
    - LICENSE
  homepage: https://github.com/bundesAPI/interpol-api

extra:
  recipe-maintainers:
    - jan-janssen
